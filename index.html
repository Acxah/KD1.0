          <div class="menu-item flow">
            <span class="menu-icon"><svg viewBox="0 0 1024 1024" width="16" height="16" fill="currentColor"><path d="M864 256c35.346 0 64 28.654 64 64v448c0 35.346-28.654 64-64 64H160c-35.346 0-64-28.654-64-64V320c0-35.346 28.654-64 64-64h704zm0 64H160v448h704V320zM256 448a32 32 0 0 1 32-32h256a32 32 0 0 1 0 64H288a32 32 0 0 1-32-32zm0 128a32 32 0 0 1 32-32h160a32 32 0 0 1 0 64H288a32 32 0 0 1-32-32z"/></svg></span>

            <span class="menu-text">抄送我的</span>

          <div class="menu-divider"></div>

          <!-- 页面菜单 -->

            <span class="menu-text">首页</span>
          </div>
          <div class="menu-item page">
            <span class="menu-icon"><svg viewBox="0 0 1024 1024" width="16" height="16" fill="currentColor"><path d="M128 160c0-17.673 14.327-32 32-32h704c17.673 0 32 14.327 32 32v64c0 17.673-14.327 32-32 32H160c-17.673 0-32-14.327-32-32v-64zm0 192c0-17.673 14.327-32 32-32h256c17.673 0 32 14.327 32 32v512c0 17.673-14.327 32-32 32H160c-17.673 0-32-14.327-32-32V352zm384 0c0-17.673 14.327-32 32-32h288c17.673 0 32 14.327 32 32v320c0 17.673-14.327 32-32 32H576c-17.673 0-32-14.327-32-32V352zm64 32v256h224V384H576z"/></svg></span>

          </div>

          <div class="menu-item page">
            <span class="menu-icon"><svg viewBox="0 0 1024 1024" width="16" height="16" fill="currentColor"><path d="M512 96c229.75 0 416 186.25 416 416S741.75 928 512 928 96 741.75 96 512 282.25 96 512 96zm0 64c-194.4 0-352 157.6-352 352s157.6 352 352 352 352-157.6 352-352-157.6-352-352-352zm-32 160h64v224h224v64H448a32 32 0 0 1-32-32V320z"/></svg></span>
            <span class="menu-text">未在当地烟草专卖批发企业进货</span>

      </aside>

      <!-- ============ 主内容区 ============ -->
      <main class="content">
        <!-- 顶部栏 -->
        <header class="page-header">
          <div class="header-title">首页</div>
          <div class="header-actions">
            <span class="header-user">
              <span class="user-avatar">阿</span>
            </span>
          </div>
        </header>

        <!-- 仪表盘主体 -->
        <div class="dashboard">

          <!-- 筛选区 -->
          <div class="widget filter-bar">
            <div class="filter-item">
              <span class="filter-label">日期时间</span>
              <div class="filter-control">
                <span class="filter-op">选择范围</span>
                <div class="date-range">
                  <input type="text" class="date-input" placeholder="开始日期">
                  <span class="date-sep">~</span>
                  <input type="text" class="date-input" placeholder="结束日期">
                  <span class="calendar-icon">
                    <svg viewBox="0 0 1024 1024" width="14" height="14" fill="currentColor"><path d="M776 201.6H670.4v-52.8c0-22.4-17.6-40-40-40s-40 17.6-40 40v54.4h-160v-54.4c0-22.4-17.6-40-40-40s-40 17.6-40 40v54.4h-99.2c-33.6 0-67.2 14.4-91.2 38.4s-36.8 57.6-36.8 91.2V784c0 35.2 12.8 67.2 36.8 91.2 24 25.6 56 38.4 91.2 38.4h528c70.4 0 128-59.2 128-131.2V329.6c-3.2-68.8-60.8-128-131.2-128zM214.4 296c9.6-9.6 20.8-14.4 33.6-14.4h100.8V336c0 22.4 17.6 40 40 40s40-17.6 40-40v-54.4h160V336c0 22.4 17.6 40 40 40s40-17.6 40-40v-54.4h105.6c27.2 0 48 22.4 48 51.2v80h-624v-80c1.6-14.4 6.4-27.2 16-36.8zM776 835.2H248c-12.8 0-24-4.8-33.6-14.4-9.6-9.6-14.4-22.4-14.4-36.8V492.8h624V784c0 28.8-22.4 51.2-48 51.2z"/></svg>
                  </span>
                </div>
              </div>
            </div>
            <div class="filter-item">
              <span class="filter-label">选择案由</span>
              <div class="filter-control">
                <span class="filter-op">等于任意一个</span>
                <div class="filter-select">
                  <input type="text" class="select-input" placeholder="请选择" readonly>
                  <span class="select-arrow"><svg viewBox="0 0 1024 1024" width="12" height="12" fill="currentColor"><path d="M512 714.667 213.333 416h597.334L512 714.667z"/></svg></span>
                </div>
              </div>
            </div>
          </div>

          <!-- 统计卡片行 -->
          <div class="stat-row">
            <div class="widget stat-card">
              <div class="stat-icon icon-blue">
                <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M512 128 128 384l384 256 384-256-384-256zM128 512l96 64v192l288 192 288-192V576l96-64v288c0 35.346-28.654 64-64 64H192c-35.346 0-64-28.654-64-64V512z"/></svg>
              </div>
              <div class="stat-body">
                <div class="stat-value">15</div>
                <div class="stat-label">案件数量</div>
              </div>
            </div>
            <div class="widget stat-card">
              <div class="stat-icon icon-cyan">
                <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M512 512m-96 0a96 96 0 1 0 192 0 96 96 0 1 0-192 0ZM256 256m-64 0a64 64 0 1 0 128 0 64 64 0 1 0-128 0ZM768 256m-64 0a64 64 0 1 0 128 0 64 64 0 1 0-128 0ZM256 768m-64 0a64 64 0 1 0 128 0 64 64 0 1 0-128 0ZM768 768m-64 0a64 64 0 1 0 128 0 64 64 0 1 0-128 0Z"/></svg>
              </div>
              <div class="stat-body">
                <div class="stat-value">15</div>
                <div class="stat-label">涉案零售户数量</div>
              </div>
            </div>
            <div class="widget stat-card">
              <div class="stat-icon icon-yellow">
                <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M512 128c-17.673 0-32 14.327-32 32v160h-96a64 64 0 0 0-64 64v96h-96c-17.673 0-32 14.327-32 32v96c0 17.673 14.327 32 32 32h96v96a64 64 0 0 0 64 64h96v160c0 17.673 14.327 32 32 32s32-14.327 32-32V800h96a64 64 0 0 0 64-64v-96h96c17.673 0 32-14.327 32-32v-96c0-17.673-14.327-32-32-32h-96v-96a64 64 0 0 0-64-64h-96V160c0-17.673-14.327-32-32-32z"/></svg>
              </div>
              <div class="stat-body">
                <div class="stat-value">2090</div>
                <div class="stat-label">案值（元）</div>
              </div>
            </div>
            <div class="widget stat-card">
              <div class="stat-icon icon-purple">
                <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M224 128h576a64 64 0 0 1 64 64v576a64 64 0 0 1-64 64H224a64 64 0 0 1-64-64V192a64 64 0 0 1 64-64zm0 64v576h576V192H224zm96 96h384v64H320v-64zm0 160h384v64H320v-64zm0 160h256v64H320v-64z"/></svg>
              </div>
              <div class="stat-body">
                <div class="stat-value">70</div>
                <div class="stat-label">涉案卷烟数量（条）</div>
              </div>
            </div>
          </div>

          <!-- 图表区 -->
          <div class="widget chart-widget">
            <div class="section-title">案件综合看板</div>
            <div class="chart-title-row">
              <span class="chart-title">案件种类分布</span>
            </div>
            <div class="chart-legend" id="chart-legend"></div>
            <div class="chart-body">
              <div id="chart-distribution" class="chart-canvas"></div>
            </div>
          </div>

          <!-- 案件明细表 -->
          <div class="widget table-widget">
            <div class="section-title">案件明细表</div>
            <div class="table-toolbar">
              <button class="btn-raw" id="btn-raw">查看原始数据</button>
            </div>
            <div class="table-scroll">
              <table class="data-table" id="data-table">
                <thead>
                  <tr>
                    <th>案件编号</th>
                    <th>日期时间</th>
                    <th>选择案由</th>
                    <th>许可证号</th>
                    <th>企业名称</th>
                    <th>社会统一信用代码</th>
                    <th>法人姓名/涉案人员</th>
                    <th>性别</th>
                    <th>经营地址/案发地址</th>
                  </tr>
                </thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
            <div class="pagination">
              <span class="page-size">20 条/页</span>
              <span class="page-total">共 15 条</span>
            </div>
          </div>

        </div>
      </main>
    </div>

  <script src="js/echarts.min.js"></script>
  <script src="js/main.js"></script>
